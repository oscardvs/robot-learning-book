        - heading "Eleven lectures, turned into something you can study from." [level=2] [ref=e157]
      - generic [ref=e158]:
        - paragraph [ref=e159]: "The course recordings are public and excellent. They are also ten and a half hours long, and a video is a bad place to look something up. This site is the same material as a written book: 92,242 words of transcript read against 484 slides, rewritten as prose that explains rather than summarises."
        - paragraph [ref=e160]: Where the lecture showed an algorithm running, the page runs it. Where it put up an equation, the equation is here with every symbol named. Where the lecturer misspoke a date or an institution, an editor’s note says so rather than quietly repeating it.
        - paragraph [ref=e161]: It is being written one chapter at a time, and the numbers above are the real state of it. Chapters that are not finished say so.
