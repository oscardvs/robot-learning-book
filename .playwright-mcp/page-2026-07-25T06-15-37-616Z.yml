    - paragraph [ref=f1e58]: Chapter 01 · after lecture 1
    - 'heading "Introduction: Why Robots Are Hard" [level=1] [ref=f1e59]'
    - paragraph [ref=f1e60]: A robot arm tried to pick up a coffee mug.
    - generic [ref=f1e61]:
      - link "watch the lecture" [ref=f1e62] [cursor=pointer]:
