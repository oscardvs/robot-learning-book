          - text: (Open X-Embodiment Collaboration, ICRA 2024). The "ImageNet for robotics" effort — the concrete artifact behind the data argument of this chapter, and the dataset the generalist policies of Chapter 9 are trained on. Best paper at ICRA 2024.
