        - text: "by trial and error, taking actions in an environment and adjusting toward the ones that earn more reward. And here the i.i.d. assumption collapses, on purpose: in reinforcement learning the robot's own action changes what it sees next, so the data points are linked in a feedback loop rather than drawn independently. An action now determines the states — and therefore the training data — the robot will encounter later."
      - paragraph [ref=f1e375]: That difference is not a detail. The breakdown of the i.i.d. assumption when actions affect future observations is the single fact that makes robot learning harder than supervised learning, and it reappears in Chapter 3 as the reason naive imitation drifts off the road, and throughout Chapters 4 and 5 as the thing reinforcement learning is built to handle.
      - heading [level=2] [ref=f1e376]:
        - link "Where this breaks" [ref=f1e377] [cursor=pointer]:
          - /url: "#where-this-breaks"
        - button "Copy Anchor Link" [ref=f1e378]
      - paragraph [ref=f1e382]: It would be dishonest to end a motivational chapter on a clean note, because the field is not clean. Four difficulties keep the "just train a big model" story from being the whole story, and they are worth naming now so you recognize them when they return.
      - paragraph [ref=f1e383]:
        - strong [ref=f1e384]: Data is scarce.
        - text: This is the recurring one. Robot data has to be produced by a human teleoperating a real machine, which is slow and expensive, so the datasets are tiny next to what trains a language model. Every scaling ambition in robotics runs first into this wall.
      - paragraph [ref=f1e385]:
        - strong [ref=f1e386]: The data is heterogeneous and multimodal.
        - text: "A language model consumes one kind of thing: text. A robot consumes images, depth, force, proprioception, and more — and every robot has different sensors and actuators, so data collected on one machine does not straightforwardly transfer to another. There is no single clean stream to scale up."
      - paragraph [ref=f1e387]:
        - strong [ref=f1e388]: It has to run in real time, so model size is a constraint, not a footnote.
        - text: You cannot put a hundred-billion-parameter model on a quadruped and wait a minute for each decision; the robot will have fallen over. A policy has to return an action fast enough to control the body, which caps how large and how slow it can be. This tension — between the capability that comes with scale and the speed that comes with smallness — has no settled resolution.
      - paragraph [ref=f1e389]:
        - strong [ref=f1e390]: Evaluation is expensive.
        - text: You cannot benchmark a robot policy by running a script over a test set. You have to put it on real hardware and watch it, one slow, breakable trial at a time. That makes progress harder to measure and slower to trust than in domains where evaluation is a function call.
      - paragraph [ref=f1e391]: None of these is solved. They are the open ground the second half of the book explores, and it is a fair summary of the field's honesty that its own introductory lecture spends its final minutes on them rather than on the demos.
      - heading [level=2] [ref=f1e392]:
        - link "What this connects to" [ref=f1e393] [cursor=pointer]:
          - /url: "#what-this-connects-to"
        - button "Copy Anchor Link" [ref=f1e394]
      - paragraph [ref=f1e398]: This chapter has drawn the map; the rest of the book walks it.
      - paragraph [ref=f1e399]:
        - text: The
        - strong [ref=f1e400]: North Star
        - text: ", stated at the end of the lecture, is a"
        - strong [ref=f1e401]: generalist robot policy
        - text: — a single model that takes in a large, mixed robot dataset and outputs actions for any task, on any robot, in any environment. A "robot brain" you could, in principle, download and run. We are not there. The chapters are the pieces of the attempt.
      - paragraph [ref=f1e402]:
        - text: "Chapter 2 builds the mathematical language for everything else:"
        - strong [ref=f1e403]: robot control and Markov decision processes
        - text: ", which make precise the state"
        - generic [ref=f1e404]: s
        - text: ", the action"
        - generic [ref=f1e408]: a
        - text: ", and the Markov assumption we leaned on in"
        - link "Equation (1.1)" [ref=f1e412] [cursor=pointer]:
          - /url: "#eq-policy"
        - text: . Chapter 3 develops
        - strong [ref=f1e413]: imitation learning
        - text: — the supervised, expert-copying route — and confronts the i.i.d. failure head-on. Chapters 4 and 5 develop
        - strong [ref=f1e414]: reinforcement learning
        - text: ", the trial-and-error route, first online and then offline. These four chapters are the fundamentals."
      - paragraph [ref=f1e415]:
        - text: The second half turns to scale. Chapter 6 (
        - strong [ref=f1e416]: generative models
        - text: ) and Chapter 7 (
        - strong [ref=f1e417]: sequence modeling and transformers
        - text: ) supply the modern machinery behind the "robotics as sequence modeling" idea, including why a policy should output a distribution rather than a point. Chapter 8 (
        - strong [ref=f1e418]: world models
        - text: ) is about robots that imagine future states in order to plan. Chapter 9 (
        - strong [ref=f1e419]: generalist robot policies
        - text: ) is the North Star made concrete, where Open X-Embodiment and the models trained on it return in force. Chapters 10 and 11 push into
        - strong [ref=f1e420]: embodied reasoning
        - text: and the field's genuine
        - strong [ref=f1e421]: open problems
        - text: ", where the honest answer to most questions is still \"we don't know yet.\""
