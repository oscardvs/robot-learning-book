      - paragraph [ref=f1e170]: The exact figures are illustrative — the lecturer flags that the accompanying circles are "not to scale" — but the ratios are the message. In the decade that took image models from ImageNet-scale to language models trained on ninety millennia of reading, the input that grew was data. That is the engine behind the "ChatGPT moment" in language and vision.
      - paragraph [ref=f1e171]:
        - text: Robotics has not had its equivalent. There is no ninety-thousand-year corpus of robot experience, because every hour of it has to be produced by a person teleoperating a real machine. The closest thing the field has built is
        - strong [ref=f1e172]: Open X-Embodiment
        - text: ", a 2024 collaboration across more than two hundred institutions that pooled data from roughly twenty-two different robot types into one common format — an attempt, explicitly, to be the \"ImageNet for robotics.\""
      - complementary [ref=f1e173]:
        - paragraph [ref=f1e174]: Editor’s note
        - paragraph [ref=f1e176]: "Open X-Embodiment (\"Open X-Embodiment: Robotic Learning Datasets and RT-X Models,\" Open X-Embodiment Collaboration; Mees is among the authors) won the Best Conference Paper award at ICRA 2024, out of 1,765 papers. The lecturer's spoken date of \"2004\" is a slip for 2024."
      - paragraph [ref=f1e177]: Even this dataset, the lecturer is careful to say, is nowhere near the scale of what trains a large language model. Data scarcity is not a solved problem in robotics. It is the defining one, and much of the second half of the book is about ways around it.
      - heading [level=2] [ref=f1e178]:
        - link "The idea that ties the field to the rest of AI" [ref=f1e179] [cursor=pointer]:
          - /url: "#the-idea-that-ties-the-field-to-the-rest-of-ai"
        - button "Copy Anchor Link" [ref=f1e180]
      - paragraph [ref=f1e184]:
        - text: Now the pivot that gives the modern field its shape. Start with an ordinary robot policy. It takes an image of the scene and a natural-language instruction — "pick up the spoon" — and it outputs a short sequence of actions, say end-effector displacements
        - generic [ref=f1e188]:
          - text: "[Δx, Δθ, Δ"
          - generic [ref=f1e189]: grip
          - text: "]"
        - text: that move the arm to the spoon and close the gripper.
      - paragraph [ref=f1e190]:
        - text: "Now squint. Replace the robot's camera image with an ordinary internet photo — the Statue of Liberty. Replace the instruction with \"caption the scene.\" Ask for the output as text, and the answer is \"a photo of the Statue of Liberty in New York.\" That is a vision-language model. The two systems have the same shape: something goes in as a mix of image and words, and something comes out as a sequence. The only difference is that the robot's output sequence is made of actions instead of words ("
        - link "Figure 1.2" [ref=f1e191] [cursor=pointer]:
          - /url: "#fig-seqmodel"
        - text: ).
