      - paragraph [ref=f1e203]:
        - text: "This is the organizing idea of the course:"
        - strong [ref=f1e204]: treat robotics as multimodal sequence modeling.
        - text: Language tokens, image tokens, and action tokens all go into one sequence, and one model learns to continue it. The reason this framing matters is not elegance. It is that it lets robotics borrow, wholesale, the machinery that vision and language spent a decade perfecting — the architectures, the pretraining tricks, the scaling recipes. If a robot policy is "just" a sequence model with an unusual output vocabulary, then every advance in sequence models is, potentially, an advance in robotics.
      - paragraph [ref=f1e205]: "So: train a big transformer on robot data and we are done? Not quite — and the reasons it is not that simple are worth stating now, because they are the obstacles the rest of the book keeps running into."
