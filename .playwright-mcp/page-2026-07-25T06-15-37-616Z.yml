    - generic [ref=f1e70]:
      - paragraph [ref=f1e71]: "A robot arm tried to pick up a coffee mug. It saw the mug as a cloud of 3-D points, computed a grasp from the geometry, closed its fingers — and snapped the mug in two. The hardware was fine. The perception ran. The plan executed with millimeter precision. And the result was a broken mug, because \"close your fingers until you hold the cup, but not so hard that you crush it\" turns out to be the kind of thing no one had written down. This chapter is about that gap: why robots that can be built cannot yet act on their own in an ordinary kitchen, and why learning from data — rather than hand-written rules — is the field's bet for closing it."
      - paragraph [ref=f1e72]: The mug is not a hypothetical. It is from Oier Mees's own PhD work in Freiburg around 2019, and he shows the failure on the first day of the course, on purpose. The point is not that the engineering was bad. The point is that grasping a mug is a member of a class of problems — physical, sensorimotor, open-ended — that has stayed stubbornly hard while other parts of artificial intelligence raced ahead. Naming that class, and explaining why it resists the usual tools, is the first thing we need to do.
      - heading [level=2] [ref=f1e73]:
        - link "The paradox at the center of robotics" [ref=f1e74] [cursor=pointer]:
          - /url: "#the-paradox-at-the-center-of-robotics"
        - button "Copy Anchor Link" [ref=f1e75]
      - paragraph [ref=f1e79]:
        - text: Hans Moravec, a roboticist at Carnegie Mellon, wrote down the puzzle in 1988. The things people find mentally hard — playing grandmaster chess, integrating a function, proving a theorem — turned out to be comparatively easy to automate. A computer beat the world chess champion in 1997. The things people find effortless — recognizing a face, walking over gravel, picking up a mug without crushing it — turned out to be extraordinarily hard. This inversion is now called
        - strong [ref=f1e80]: Moravec's paradox
        - text: .
      - complementary [ref=f1e81]:
        - paragraph [ref=f1e82]: Editor’s note
        - paragraph [ref=f1e84]: "Moravec's original framing is usually paraphrased: \"it is comparatively easy to make computers exhibit adult-level performance on intelligence tests, and difficult or impossible to give them the skills of a one-year-old.\" The lecture states the paradox and attributes it to Moravec (CMU, 1988) without quoting it; the wording here is standard background."
      - paragraph [ref=f1e85]: Why the inversion? One good answer is about data. Abstract reasoning leaves a paper trail — books of chess games, worked proofs, tables of logarithms — that a machine can study. Sensorimotor skill does not. No one has written down, in any form a computer can read, the millions of tiny corrections your hand makes as it lifts a mug. You cannot crawl the internet for it. A toddler learns it by flailing for months; an orangutan learns to use a stick by watching another orangutan. The knowledge is real, but it lives in bodies and experience, not in text. That absence of ready-made data is the thread that runs through this entire book.
      - paragraph [ref=f1e86]: "Hold onto the shape of the problem: the easy-looking task is the hard one, and the reason it is hard is that the data to learn it from does not already exist in a convenient form. Everything that follows is, in one way or another, a response to that fact."
      - heading [level=2] [ref=f1e87]:
        - link "The old way, and where it stops" [ref=f1e88] [cursor=pointer]:
          - /url: "#the-old-way-and-where-it-stops"
        - button "Copy Anchor Link" [ref=f1e89]
      - paragraph [ref=f1e93]: Robots did not wait for machine learning to become useful. They have been working in factories for half a century. It helps to understand exactly how, because the successes and the limits both come from the same design.
      - paragraph [ref=f1e94]:
        - text: The classical recipe is
        - strong [ref=f1e95]: sense–plan–act
        - text: . The robot senses the world through its cameras and range-finders and builds a model of where things are. It plans a sequence of motions through that model. Then it acts, executing the plan with high precision. The very first mobile robot to do this was
        - strong [ref=f1e96]: Shakey
        - text: ", built at SRI in 1966. Shakey carried a television camera and bump sensors, and it reasoned about its blocks-world of rooms and doorways before it moved."
      - complementary [ref=f1e97]:
        - paragraph [ref=f1e98]: Editor’s note
        - paragraph [ref=f1e100]:
          - text: "The course slides and the lecturer both say \"Shakey, Stanford 1966.\" Shakey was in fact built at SRI International in Menlo Park, which was affiliated with but distinct from Stanford. The date is right; the institution is loosely stated. It is a genuinely important robot for an unrelated reason given in the lecture: the"
          - strong [ref=f1e101]: A*
          - text: search algorithm, still taught in every AI course, was invented to let Shakey plan its routes.
      - paragraph [ref=f1e102]: "Shakey planned so slowly — minutes to an hour per decision — that it was more a proof of concept than a worker. The industrial robots that followed in the 1970s and 80s kept the sense–plan–act loop but ran it fast and in tightly controlled settings. A welding arm on a car assembly line senses very little, because it does not have to: the car is always in the same place, so the arm can follow a geometric plan in a known map and hit its targets to a fraction of a millimeter. This has been one of the most successful ideas in the history of engineering."
      - paragraph [ref=f1e103]:
        - text: It works because of an assumption, and it fails for the same reason. The assumption is a
        - strong [ref=f1e104]: closed world
        - text: ": everything relevant is known, modeled, and fixed in advance. Under that assumption a robot is a state machine, and a state machine is exactly as good as the logic written into it. Move the part two centimeters, change the lighting, hand it an object it has never seen, and it has no way to cope, because coping was never in the program. These robots were, in the lecturer's word, \"blind\" — not for lack of sensors, but because they had no capacity to adapt to anything the engineer had not foreseen."
      - paragraph [ref=f1e105]:
        - text: You can watch the assumption break. The videos from the DARPA Robotics Challenge in 2015 show state-of-the-art humanoids falling over while trying to open a door or turn a valve. Even Boston Dynamics' Atlas, some of the finest robot hardware ever built, has historically leaned on near-perfect
        - strong [ref=f1e106]: state estimation
        - text: — often with QR codes stuck around the environment so the robot always knows exactly where everything is. Get a few centimeters off, and an impressive backflip becomes an expensive pile of parts on the floor. The precision that makes these machines look superhuman in a demo is also what makes them brittle outside of it.
      - paragraph [ref=f1e107]: So the closed-world recipe gives up either generality (the factory arm, which never leaves its cage) or steadiness in the plain sense of not-falling-over (the humanoid, which needs the world pinned down for it). Escaping that trade-off — letting a robot handle the edge cases of a real, unstructured environment — is the problem this course sets itself.
      - heading [level=2] [ref=f1e108]:
        - link "What \"robot learning\" means" [ref=f1e109] [cursor=pointer]:
          - /url: "#what-robot-learning-means"
        - button "Copy Anchor Link" [ref=f1e110]
      - paragraph [ref=f1e114]: "Here is the definition the course uses, stated plainly on the slide and worth taking literally:"
      - blockquote [ref=f1e115]:
        - paragraph [ref=f1e116]: Robot learning is the study of algorithms that enable a robot to acquire new skills or adapt to an unstructured environment by learning from data and experience, rather than relying on explicit or hand-coded programming.
      - paragraph [ref=f1e117]: Read it against the previous section. "Unstructured environment" is the opposite of the closed world. "Learning from data and experience" is the opposite of hand-coded logic. The definition is a direct answer to where sense–plan–act stops.
      - paragraph [ref=f1e118]:
        - text: "There is a second, blunter way the course frames the same idea:"
        - strong [ref=f1e119]: robot learning is solving robotics with machine learning
        - text: ". Picture two columns. On the left are the pillars of classical robotics — perception (how the robot sees) and control (how it moves) — where decades of careful model-based engineering already live. On the right is the machine-learning toolbox: imitation learning, reinforcement learning, and the representation- and dynamics-learning methods that come later in the book. Robot learning is the project of using the right column to fill the gaps in the left. It is the intersection of a field rooted in the physical world with a field that has thrived in the digital one, and the hoped-for payoff is to bring the generalization we have seen from data-driven models into the physical world ("
        - link "Figure 1.1" [ref=f1e120] [cursor=pointer]:
          - /url: "#fig-venn"
        - text: ).
      - 'figure "Fig 1.1 L1 · 35:44 — watch this slide in the recording The two parents of robot learning. Robotics lives in the physical world and reaches its solutions by engineering models; machine learning lives in the digital world and reaches its solutions from data. Robot learning is their intersection — generalization brought into physical action. Credit: course slides, Lecture 1." [ref=f1e121]':
        - generic [ref=f1e123]:
          - generic [ref=f1e124]:
            - generic [ref=f1e125]: Fig 1.1
            - link "L1 · 35:44 — watch this slide in the recording" [ref=f1e126] [cursor=pointer]:
              - /url: https://www.youtube.com/watch?v=X0k14u6pSxw&t=2144s
              - text: L1 · 35:44
              - generic [ref=f1e129]: — watch this slide in the recording
          - paragraph [ref=f1e131]: "The two parents of robot learning. Robotics lives in the physical world and reaches its solutions by engineering models; machine learning lives in the digital world and reaches its solutions from data. Robot learning is their intersection — generalization brought into physical action. Credit: course slides, Lecture 1."
      - paragraph [ref=f1e132]:
        - text: "Before going further, one distinction clears up a lot of confusion. What counts as a robot? Take three machines from the lecture: a dishwasher, the da Vinci surgical system, and ChatGPT running on a phone. A dishwasher is a robot in the sense that matters here — it senses and changes the physical state of the world on its own. ChatGPT is not: it reasons impressively but has no body and leaves the world exactly as it found it. The surgical system is the interesting case. It is"
        - strong [ref=f1e133]: teleoperated
        - text: "— a surgeon drives it, and it filters out the tremor in their hands — so it changes the world with great dexterity but is not autonomous. Robot learning wants all three virtues at once: the reliability of the appliance, the physical dexterity of the surgical arm, and the general reasoning of the language model, in a single system that decides for itself."
      - heading [level=2] [ref=f1e134]:
        - link "Why now" [ref=f1e135] [cursor=pointer]:
          - /url: "#why-now"
        - button "Copy Anchor Link" [ref=f1e136]
      - paragraph [ref=f1e140]: If the hardware to do useful physical work has existed for years, why are our homes still robot-free? The honest short answer is that until recently three ingredients were missing at once, and all three have only just arrived.
      - paragraph [ref=f1e141]:
        - strong [ref=f1e142]: Hardware was never really the blocker.
        - text: "In 2007, a robot at Stanford called the PR1 tidied a living room — picking up clutter, putting things away. It looked like the future. It was also entirely teleoperated: a person off-camera was driving it. That is oddly encouraging. It means the mechanical ability to tidy a room has been available since 2007, and what was missing was not the arm but the brain — the software that would let the robot do it without a human at the controls. Since then the hardware has only gotten better, moving from one-off research prototypes to a competitive industry of humanoids from Figure, Tesla, Boston Dynamics, and others."
      - paragraph [ref=f1e143]:
        - strong [ref=f1e144]: Compute arrived on the back of the GPU.
        - text: The clusters that train modern vision and language models simply did not exist in 2007. Their appearance is what let the scaling laws that worked for text and images start to work at all.
      - paragraph [ref=f1e145]:
        - strong [ref=f1e146]: Data is the ingredient still in shortest supply, and it is the most important one.
        - text: To feel the scale that drove the last decade of AI, the lecture does a nice back-of-the-envelope calculation, which we can treat as the chapter's first worked example.
      - heading [level=3] [ref=f1e147]:
        - 'link "Worked example: how long would it take a person to read the training set?" [ref=f1e148] [cursor=pointer]':
          - /url: "#worked-example-how-long-would-it-take-a-person-to-read-the-training-set"
        - button "Copy Anchor Link" [ref=f1e149]
      - paragraph [ref=f1e153]: Take three landmark datasets and ask how long a single human, reading or looking without pause, would take to get through the data a model was trained on.
      - table [ref=f1e155]:
        - rowgroup [ref=f1e156]:
          - row [ref=f1e157]:
